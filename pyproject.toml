[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamicsadapt"
version = "0.1.0"
description = "Agent-driven dynamics diagnosis and reinforcement-learning recovery"
readme = "README.md"
requires-python = ">=3.11"

# Isaac Sim and RoboDojo dependencies belong to a separate simulator environment.
dependencies = ["numpy", "imageio[ffmpeg]"]

[project.optional-dependencies]
dev = ["ruff>=0.4"]
rl = ["torch>=2.8,<3"]

[project.scripts]
dynamicsadapt = "orchestrator.__main__:main"

[tool.setuptools.packages.find]
include = ["simulators*", "orchestrator*", "integrations*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# vendor/ is upstream's code. We do not lint it and we do not reformat it.
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
